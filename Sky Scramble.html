<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sky Scramble</title>
  <style>
    :root { --ink:#f7f6ff; --violet:#7c4dff; --cyan:#39e8ff; --pink:#ff4e9b; --navy:#0c1230; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; color:var(--ink); font-family:ui-rounded, "Arial Rounded MT Bold", system-ui, sans-serif; background:#06091e; }
    body:before { content:""; position:fixed; inset:0; background:linear-gradient(#0b1038aa,#080b22bb),url('background-platform-original.png') center/cover no-repeat; z-index:-2; }
    body[data-theme="neon"]:before { filter:hue-rotate(75deg) saturate(1.55); }
    body[data-theme="lava"]:before { filter:hue-rotate(155deg) saturate(1.45); }
    body[data-theme="ice"]:before { filter:hue-rotate(20deg) saturate(.7) brightness(1.25); }
    body.reduce-flash * { animation:none!important; transition:none!important; }
    #app { width:min(1100px,100vw); height:100vh; margin:auto; display:grid; grid-template-rows:auto 1fr; padding:18px 22px 16px; gap:12px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .logo { font-size:clamp(22px,4vw,38px); font-weight:1000; letter-spacing:-2px; font-style:italic; text-shadow:3px 3px 0 #e5378d; }
    .logo i { color:var(--cyan); font-style:normal; }
    .round { font-weight:800; color:#cdd0ff; letter-spacing:.08em; font-size:12px; }
    #hud { display:flex; gap:10px; }
    .player-card { border:2px solid; border-radius:14px; min-width:122px; padding:8px 12px; background:#0e153ccc; box-shadow:0 7px 24px #0005; }
    .player-card .name { display:block; font-size:11px; font-weight:900; letter-spacing:.12em; opacity:.85; }
    .player-card strong { display:block; font-size:25px; line-height:1; margin-top:2px; }
    main { position:relative; min-height:0; border:2px solid #7164c5; border-radius:24px; overflow:hidden; box-shadow:0 18px 50px #0008, inset 0 0 38px #3553b344; background:linear-gradient(#1a2776aa,#0d1239cc); }
    canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
    #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:#070b25bb; backdrop-filter:blur(7px); text-align:center; transition:.2s; }
    #panel { max-width:550px; max-height:82vh; overflow-y:auto; padding:28px 34px 26px; border:2px solid #8d7df5; border-radius:24px; background:linear-gradient(140deg,#22265c,#101539); box-shadow:0 16px 60px #000b; scrollbar-color:#8d7df5 #0b1030; }
    h1 { margin:0; font-size:clamp(35px,7vw,68px); line-height:.9; letter-spacing:-.08em; font-style:italic; color:var(--cyan); text-shadow:4px 4px #e8358e; }
    h2 { margin:12px 0 8px; font-size:24px; }
    p { color:#d2d6ff; line-height:1.45; }
    .keys { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:18px 0; text-align:left; }
    .key { padding:10px; border-radius:11px; background:#070b28; border:1px solid #5963b2; font-size:13px; line-height:1.5; }
    kbd { padding:2px 6px; border-radius:5px; background:#e8ecff; color:#11162e; font-family:inherit; font-weight:900; }
    button { border:0; padding:13px 24px; border-radius:999px; color:#08102b; font:900 16px inherit; cursor:pointer; background:linear-gradient(90deg,var(--cyan),#9aa4ff); box-shadow:0 5px 0 #3666a4; }
    button:active { transform:translateY(3px); box-shadow:0 2px 0 #3666a4; }
    .hint { font-size:12px; margin:12px 0 0; opacity:.75; }
    select, input[type="color"] { margin:5px 0 0; width:100%; border-radius:7px; border:1px solid #7181d8; background:#111943; color:#fff; padding:5px; font:700 12px inherit; }
    input[type="color"] { height:31px; padding:2px; }
    #touch { position:fixed; inset:auto 12px 12px; display:none; justify-content:space-between; pointer-events:none; }
    #touch div { display:flex; gap:8px; pointer-events:auto; }
    #touch button { width:48px; height:48px; padding:0; border-radius:14px; opacity:.75; }
    @media (pointer:coarse) { #touch { display:flex; } }
    @media (max-width:650px) { #app{padding:10px} header{flex-wrap:wrap}.player-card{min-width:95px}.keys{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div id="app">
    <header><div class="logo">SKY <i>SCRAMBLE</i></div><div class="round" id="round">ROUND 1 / 5</div><div id="hud"></div></header>
    <main><canvas id="game" width="1000" height="650"></canvas><div id="overlay"><section id="panel"></section></div></main>
  </div>
  <div id="touch"><div><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">↑</button></div><div><button data-key="arrowleft">◀</button><button data-key="arrowright">▶</button><button data-key="arrowup">↑</button></div></div>
  <script>
  (() => {
    const canvas=document.querySelector('#game'), ctx=canvas.getContext('2d'), panel=document.querySelector('#panel'), overlay=document.querySelector('#overlay');
    const W=1000,H=650, keys={}, palettes=[{c:'#39e8ff',d:'#057dba',name:'P1 · CYAN'},{c:'#ff4e9b',d:'#a61666',name:'P2 · PINK'}];
    const players=palettes.map((p,i)=>({...p,x:i?900:70,y:560,vx:0,vy:0,w:27,h:35,score:0,spawnX:i?900:70,onGround:false,dash:0,dashLock:0,shield:0,finish:false,respawn:0}));
    let platforms=[], powerups=[], particles=[], projectiles=[], hazards=[], stars=[], round=1, time=75, state='intro', last=0, timerId=null, terrainClock=0, terrainSeed=0, matchLength=5, gameSpeed=1, modifier='NORMAL', audioCtx=null, practice=false, chaos=false, shake=0, replay=[], frozenAt=0;
    const schemes={wasd:{left:'a',right:'d',jump:'w',dash:'f',use:'q'},tfgh:{left:'f',right:'h',jump:'t',dash:'g',use:'r'},arrows:{left:'arrowleft',right:'arrowright',jump:'arrowup',dash:'/',use:'.'},ijkl:{left:'j',right:'l',jump:'i',dash:'k',use:'o'}};
    for(let i=0;i<100;i++) stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+1,a:Math.random()*.7+.2});
    addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();if(state==='playing')pauseGame();else if(state==='paused')resumeGame();return}keys[e.key.toLowerCase()]=true;if(['arrowup','arrowleft','arrowright',' ','/'].includes(e.key.toLowerCase()))e.preventDefault();if(state==='intro'||state==='between'||state==='gameover') if(e.key==='Enter') startRound();if(state==='paused'&&e.key==='Enter')resumeGame();});
    addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
    document.querySelectorAll('#touch button').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
    function shade(hex,amount){let n=parseInt(hex.slice(1),16),r=Math.max(0,((n>>16)&255)+amount),g=Math.max(0,((n>>8)&255)+amount),b=Math.max(0,(n&255)+amount);return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('')}
    function applySelections(){players.forEach((p,i)=>{let color=document.querySelector(`#color${i}`).value;p.c=color;p.d=shade(color,-65);p.avatar=document.querySelector(`#avatar${i}`).value;p.controls=schemes[document.querySelector(`#controls${i}`).value];p.trail=document.querySelector(`#trail${i}`).value});matchLength=+document.querySelector('#matchlen').value;gameSpeed=+document.querySelector('#speed').value;chaos=document.querySelector('#chaos').checked;document.body.classList.toggle('reduce-flash',document.querySelector('#reduce').checked);}
    function showIntro(){panel.innerHTML=`<h1>SKY SCRAMBLE</h1><h2>Pick your scrambler.</h2><p>Build your matchup, then race through shifting arenas.</p><div class="keys"><div class="key"><b style="color:${players[0].c}">PLAYER 1</b><br>Character<select id="avatar0"><option value="runner">Runner</option><option value="bot">Bot</option><option value="ghost">Ghost</option></select>Color<input id="color0" type="color" value="${players[0].c}">Trail<select id="trail0"><option value="spark">Sparks</option><option value="star">Stars</option><option value="mist">Mist</option></select>Controls<select id="controls0"><option value="wasd">WASD + F/Q</option><option value="tfgh">TFGH + G/R</option></select></div><div class="key"><b style="color:${players[1].c}">PLAYER 2</b><br>Character<select id="avatar1"><option value="runner">Runner</option><option value="bot">Bot</option><option value="ghost">Ghost</option></select>Color<input id="color1" type="color" value="${players[1].c}">Trail<select id="trail1"><option value="spark">Sparks</option><option value="star">Stars</option><option value="mist">Mist</option></select>Controls<select id="controls1"><option value="arrows">Arrows + / .</option><option value="ijkl">IJKL + K/O</option></select></div></div><div class="keys"><div class="key">Match length<select id="matchlen"><option value="3">Best of 3</option><option value="5" selected>Best of 5</option><option value="7">Best of 7</option></select><label><input id="chaos" type="checkbox"> Chaos mode</label></div><div class="key">Game speed<select id="speed"><option value=".8">Relaxed</option><option value="1" selected>Standard</option><option value="1.2">Turbo</option></select><label><input id="reduce" type="checkbox"> Reduce flashing</label></div></div><button>START MATCH</button><button id="practice">PRACTICE MODE</button><p class="hint"><b>How to play:</b> reach the beacon first. Tap or hold jump, dash gaps, and use pickups. Controller: left stick / A jump / X dash / B power.</p>`;panel.querySelector('button').onclick=()=>{practice=false;applySelections();startRound()};panel.querySelector('#practice').onclick=()=>{practice=true;applySelections();startRound()};}
    function makeLevel(resetPickups=true){
      const shift=[-45,35,85][terrainSeed%3];
      platforms=[{x:0,y:620,w:1000,h:30},{x:30,y:570,w:92,h:18},{x:170,y:595,w:75,h:18},{x:300,y:555,w:78,h:18},{x:425,y:585,w:75,h:18},{x:570,y:545,w:82,h:18},{x:725,y:575,w:78,h:18},{x:870,y:525,w:95,h:18},{x:745,y:475,w:76,h:18},{x:605,y:500,w:74,h:18},{x:470+shift,y:455,w:76,h:18},{x:330,y:490,w:74,h:18},{x:190,y:445,w:80,h:18},{x:65,y:470,w:74,h:18},{x:115,y:395,w:80,h:18},{x:250+shift,y:410,w:74,h:18},{x:385,y:375,w:78,h:18},{x:520,y:405,w:72,h:18},{x:650,y:365,w:80,h:18},{x:790,y:390,w:74,h:18},{x:865,y:320,w:85,h:18},{x:720,y:295,w:72,h:18},{x:580,y:325,w:74,h:18},{x:445,y:285,w:76,h:18},{x:310,y:315,w:72,h:18},{x:180,y:270,w:80,h:18},{x:55,y:300,w:76,h:18},{x:115,y:215,w:82,h:18},{x:260+shift,y:230,w:72,h:18},{x:395,y:190,w:78,h:18},{x:535,y:220,w:70,h:18},{x:680,y:175,w:78,h:18},{x:810,y:200,w:90,h:18},{x:690,y:120,w:72,h:18},{x:555,y:145,w:75,h:18},{x:500,y:75,w:130,h:18}];
      platforms.forEach(pl=>pl.home=pl.x);
      platforms[8].kind='spring'; platforms[14].kind='conveyor'; platforms[22].kind='collapse'; platforms[30].kind='spring';
      if(resetPickups) powerups=[{x:405,y:545,type:'gun'},{x:640,y:350,type:'gun'},{x:710,y:140,type:'gun'},{x:160,y:380,type:'trap'},{x:520,y:265,type:'trap'},{x:290+shift,y:145,type:'trap'},{x:750,y:465,type:'shield'},{x:250,y:410,type:'double'},{x:575,y:390,type:'swap'},{x:160,y:215,type:'speed'}];
      hazards=[{x:245,y:600,w:55,kind:'spikes',active:true},{x:500,y:600,w:55,kind:'spikes',active:true},{x:810,y:600,w:55,kind:'spikes',active:true},{platform:16,kind:'saw',phase:0,active:true},{platform:21,kind:'saw',phase:1.3,active:true},{platform:24,kind:'saw',phase:2.4,active:true},{platform:28,kind:'saw',phase:3.1,active:true},{platform:33,kind:'saw',phase:4,active:true},{x:335,y:350,w:105,h:7,kind:'laser',active:true},{x:590,y:305,w:118,h:7,kind:'laser',active:true},{x:120,y:205,w:90,h:7,kind:'laser',active:true},{x:740,y:145,w:82,h:7,kind:'laser',active:true},{x:755,y:465,w:85,h:7,kind:'laser',active:true},{x:205,y:430,w:85,h:7,kind:'laser',active:true},{x:410,y:275,w:92,h:7,kind:'laser',active:true},{x:545,y:215,w:80,h:7,kind:'laser',active:true},{x:530,y:355,w:19,h:19,kind:'orb',active:true},{x:255,y:255,w:19,h:19,kind:'orb',active:true},{x:670,y:255,w:19,h:19,kind:'orb',active:true},{x:445,y:170,w:19,h:19,kind:'orb',active:true},{x:805,y:305,w:19,h:19,kind:'orb',active:true},{x:135,y:350,w:19,h:19,kind:'orb',active:true}];
    }
    function startRound(){ clearInterval(timerId); state='countdown'; time=75; terrainClock=0; terrainSeed=round-1; projectiles=[];modifier=['LOW GRAVITY','HAZARD RUSH','DARKNESS','DOUBLE POINTS'][Math.floor(Math.random()*4)];document.body.dataset.theme=['sky','neon','lava','ice'][(round-1)%4];document.querySelector('main').style.filter=modifier==='DARKNESS'?'brightness(.65)':'none';makeLevel();players.forEach(p=>{p.x=p.spawnX;p.y=560;p.vx=p.vy=0;p.finish=false;p.respawn=0;p.shield=0;p.power=null;p.facing=p.spawnX<500?1:-1;p.fireLock=0;p.double=0;p.boost=0;p.jumpLock=false;p.jumpHold=0});if(practice)players[1].respawn=999999;let count=3;overlay.style.display='flex';panel.innerHTML=`<h1>${count}</h1><h2>${practice?'PRACTICE':modifier}</h2><p>First player to the beacon wins.</p>`;let cd=setInterval(()=>{count--;if(count>0){panel.querySelector('h1').textContent=count;beep(300+count*80,.08)}else{clearInterval(cd);state='playing';overlay.style.display='none';beep(880,.18)}},700);timerId=setInterval(()=>{if(state==='playing'){time--;if(time<=0)endRound()}},1000);updateHud(); }
    function pauseGame(){frozenAt=performance.now();state='paused';panel.innerHTML=`<h1>PAUSED</h1><h2>Take a breather.</h2><p>The match clock, hazards, effects, and scenery are frozen.</p><button>RESUME MATCH</button><p class="hint">Press Escape or Enter to resume</p>`;overlay.style.display='flex';panel.querySelector('button').onclick=resumeGame;}
    function resumeGame(){if(state!=='paused')return;last=performance.now();state='playing';overlay.style.display='none';}
    function updateHud(){document.querySelector('#round').textContent=`ROUND ${round} / ${matchLength} · ${time}s · ${modifier} · SHIFT ${Math.max(0,Math.ceil(2-terrainClock/60))}`;document.querySelector('#hud').innerHTML=players.map(p=>`<div class="player-card" style="border-color:${p.c}"><span class="name">${p.name}${p.power?` · ${p.power.toUpperCase()}`:''}</span><strong>${p.score}</strong><div style="height:4px;margin-top:5px;background:#090d2a;border-radius:4px"><i style="display:block;height:100%;width:${Math.max(0,Math.min(100,100-p.y/6.2))}%;background:${p.c};border-radius:4px"></i></div></div>`).join('');}
    function endRound(){if(state!=='playing')return;state='between';clearInterval(timerId);let winner=[...players].sort((a,b)=>b.score-a.score)[0],record=Math.max(+localStorage.getItem('skyScrambleHighScore')||0,winner.score);localStorage.setItem('skyScrambleHighScore',record);panel.innerHTML=`<h1>${round===matchLength?'MATCH OVER':'ROUND '+round+'!'}</h1><h2>${round===matchLength?winner.name+' WINS!':'Get ready for the next climb.'}</h2><p>${players.map(p=>`${p.name}: <b>${p.score}</b>`).join(' &nbsp; · &nbsp; ')}<br>Local high score: <b>${record}</b></p><button>${round===matchLength?'PLAY AGAIN':'NEXT ROUND'}</button><p class="hint">Press Enter to continue</p>`;overlay.style.display='flex';panel.querySelector('button').onclick=()=>{if(round===matchLength){round=1;players.forEach(p=>p.score=0);showIntro()}else{round++;startRound()}};}
    function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
    function sawPosition(h,now=performance.now()){let pl=platforms[h.platform],q=(now*.0017+h.phase)%4,x,y;if(q<1){x=pl.x+q*pl.w-11;y=pl.y-28}else if(q<2){x=pl.x+pl.w+4;y=pl.y-28+(q-1)*46}else if(q<3){x=pl.x+pl.w-(q-2)*pl.w-11;y=pl.y+18}else{x=pl.x-15;y=pl.y+18-(q-3)*46}return{x,y}}
    function controls(p,i,dt){let c=p.controls||schemes[i?'arrows':'wasd'],pad=navigator.getGamepads?.()[i],left=keys[c.left]||(pad?.axes[0]||0)<-.35,right=keys[c.right]||(pad?.axes[0]||0)>.35,jump=keys[c.jump]||pad?.buttons[0]?.pressed,dash=keys[c.dash]||pad?.buttons[2]?.pressed,use=keys[c.use]||pad?.buttons[1]?.pressed;let dir=(right?1:0)-(left?1:0);if(dir)p.facing=dir;p.vx+=dir*(p.boost>0?1.15:.72)*dt;p.vx*=.82;if(jump&&!p.jumpLock&&(p.onGround||p.double>0)){if(!p.onGround)p.double=0;p.vy=-9;p.onGround=false;p.jumpLock=true;p.jumpHold=0;beep(440,.04)}if(jump&&p.jumpLock&&p.jumpHold<8&&p.vy<0){p.vy-=.4*dt;p.jumpHold+=dt}if(!jump)p.jumpLock=false;if(dash&&p.dashLock<=0){p.dash=10;p.dashLock=35;p.vx=(dir||p.facing||1)*15;keys[c.dash]=false;beep(220,.05)}if(use&&p.power&&p.fireLock<=0){usePower(p,i);keys[c.use]=false;}p.dash=Math.max(0,p.dash-dt);p.dashLock=Math.max(0,p.dashLock-dt);p.shield=Math.max(0,p.shield-dt);p.fireLock=Math.max(0,p.fireLock-dt);p.boost=Math.max(0,p.boost-dt);}
    function beep(freq,dur){try{audioCtx??=new AudioContext();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.035,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
    function usePower(p,i){const foe=players[1-i];if(p.power==='gun'){projectiles.push({x:p.x+p.w/2+p.facing*16,y:p.y+14,vx:p.facing*16,owner:i,life:74});beep(780,.08)}else if(p.power==='trap'){let target=platforms.find(pl=>foe.x+foe.w/2>pl.x&&foe.x+foe.w/2<pl.x+pl.w&&Math.abs((foe.y+foe.h)-pl.y)<32);if(target){target.moving=1;target.moveDir=foe.x+foe.w/2<500?1:-1;target.moveTime=150;burst(foe.x,foe.y,'#ff4e9b',18)}beep(180,.12)}else if(p.power==='shield'){p.shield=480;beep(620,.1)}else if(p.power==='double'){p.double=1;beep(510,.1)}else if(p.power==='swap'){[p.x,foe.x]=[foe.x,p.x];[p.y,foe.y]=[foe.y,p.y];beep(320,.14)}else if(p.power==='speed'){p.boost=480;beep(920,.1)}p.power=null;p.fireLock=25;}
    function burst(x,y,c,n=12){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,life:20+Math.random()*16,c});}
    function tick(t){let dt=Math.min(2,(t-last)/16.67||1)*gameSpeed;last=t;let visualTime=state==='paused'?frozenAt:t;ctx.clearRect(0,0,W,H);if(state==='playing'&&shake>0){canvas.style.transform=`translate(${(Math.random()-.5)*shake}px,${(Math.random()-.5)*shake}px)`;shake-=dt}else if(state!=='paused')canvas.style.transform='';drawBackground(visualTime);if(state==='playing')run(dt);drawWorld(visualTime);requestAnimationFrame(tick)}
    function knockOut(p,owner=-1){if(p.respawn>0)return;if(p.shield>0){p.shield=0;burst(p.x,p.y,'#fff',14);return}shake=14;p.respawn=52;p.x=p.spawnX;p.y=540;p.vx=p.vy=0;burst(p.x,p.y,'#ff537d',28);if(owner>=0)players[owner].score++;}
    function run(dt){terrainClock+=dt;if(terrainClock>(chaos?60:120)){terrainClock=0;terrainSeed++;makeLevel(false);particles.push({x:500,y:320,vx:0,vy:-1,life:80,c:'#b3a6ff'});}for(const h of hazards){if(h.kind!=='laser'&&h.kind!=='orb')continue;h.blink=(h.blink??Math.random()*40)-dt*(modifier==='HAZARD RUSH'?2:1);if(h.blink<=0){h.active=Math.random()>.42;h.blink=22+Math.random()*58}}for(const pl of platforms){if(pl.crumble){pl.crumble-=dt;if(pl.crumble<=0)pl.y+=8*dt}if(!pl.moving)continue;let dx=pl.moveDir*3.2*dt;pl.x+=dx;pl.moveTime-=dt;if(Math.abs(pl.x-pl.home)>150||pl.moveTime<=0){pl.x=pl.home;pl.moving=0;dx=0}players.forEach(p=>{if(p.respawn<=0&&p.x+p.w/2>pl.x-dx&&p.x+p.w/2<pl.x-dx+pl.w&&Math.abs((p.y+p.h)-pl.y)<10)p.x+=dx});}
      for(let i=0;i<players.length;i++){let p=players[i];if(p.respawn>0){p.respawn-=dt;continue}controls(p,i,dt);p.vy+=.68*dt*(modifier==='LOW GRAVITY'?.55:1);p.x+=p.vx*dt;p.y+=p.vy*dt;p.x=Math.max(0,Math.min(W-p.w,p.x));p.onGround=false;for(const pl of platforms){if(rect(p,pl)&&p.vy>=0&&p.y+p.h-p.vy*dt<=pl.y+6){p.y=pl.y-p.h;p.vy=pl.kind==='spring'?-20:0;p.onGround=pl.kind!=='spring';if(pl.kind==='conveyor')p.x+=2.8*dt;if(pl.kind==='collapse')pl.crumble=40;}}
        if(p.y>H+40)knockOut(p);for(let j=powerups.length-1;j>=0;j--){let u=powerups[j];if(p.x+p.w>u.x-13&&p.x<u.x+13&&p.y+p.h>u.y-13&&p.y<u.y+13){p.power=u.type;powerups.splice(j,1);burst(u.x,u.y,u.type==='gun'?'#ffe65c':'#ff4e9b');}}
        for(const h of hazards){let pos=h.kind==='saw'?sawPosition(h):{x:h.x,y:h.y},hx=pos.x,hy=pos.y,hw=h.kind==='saw'?22:h.w,hh=h.kind==='saw'?22:(h.h||22);let hit=h.kind==='spikes'?p.x+p.w>hx&&p.x<hx+hw&&p.y+p.h>=hy:Math.max(p.x,hx)<Math.min(p.x+p.w,hx+hw)&&Math.max(p.y,hy)<Math.min(p.y+p.h,hy+hh);if(h.active&&hit)knockOut(p,h.owner??-1);}
        if(p.x+p.w/2>505&&p.x+p.w/2<555&&p.y<75&&!p.finish){p.finish=true;p.score+=modifier==='DOUBLE POINTS'?10:5;burst(p.x,p.y,p.c,28);beep(1040,.22);endRound();}
      }
      projectiles=projectiles.filter(s=>{s.x+=s.vx*dt;s.life-=dt;let target=players[1-s.owner];if(s.life>0&&target.respawn<=0&&s.x>target.x&&s.x<target.x+target.w&&s.y>target.y&&s.y<target.y+target.h){knockOut(target,s.owner);burst(s.x,s.y,'#ffe65c',12);return false}return s.life>0&&s.x>-30&&s.x<W+30});
      hazards=hazards.filter(h=>h.life==null||(h.life-=dt)>0);let a=players[0],b=players[1];if(a.respawn<=0&&b.respawn<=0&&rect(a,b)){let hitter=a.dash>0?a:b.dash>0?b:null,victim=hitter===a?b:hitter===b?a:null;if(hitter&&victim)knockOut(victim,hitter===a?0:1)}particles=particles.filter(q=>(q.life-=dt)>0);particles.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt});updateHud();}
    function drawBackground(t){ctx.fillStyle='#d5d7ff';for(const s of stars){ctx.globalAlpha=s.a;ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.fillStyle='#7582e633';for(let i=0;i<7;i++){let x=(i*180+(t*.012)%180)-180;ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+120,H);ctx.lineTo(x+60,360);ctx.fill()}}
    function drawWorld(t){for(const pl of platforms){ctx.fillStyle=pl.moving?'#a32d77':'#2d357c';ctx.fillRect(pl.x,pl.y,pl.w,pl.h);ctx.fillStyle=pl.moving?'#ff82ba':'#8f9aff';ctx.fillRect(pl.x,pl.y,pl.w,4);ctx.fillStyle='#151944';ctx.fillRect(pl.x,pl.y+pl.h-4,pl.w,4)}hazards.forEach(h=>{let pos=h.kind==='saw'?sawPosition(h,t):{x:h.x,y:h.y},x=pos.x,y=pos.y;ctx.globalAlpha=h.active?1:.16;if(h.kind==='saw'){ctx.fillStyle='#ffdc5a';ctx.save();ctx.translate(x+11,y+11);ctx.rotate(t*.012);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.fillRect(8,-3,8,6)}ctx.beginPath();ctx.arc(0,0,9,0,7);ctx.fill();ctx.restore()}else if(h.kind==='laser'){ctx.fillStyle='#ff58a8';ctx.shadowColor='#ff58a8';ctx.shadowBlur=12;ctx.fillRect(x,y,h.w,h.h);ctx.shadowBlur=0;ctx.fillStyle='#ffe8f4';ctx.fillRect(x,y+2,h.w,2)}else if(h.kind==='orb'){ctx.fillStyle='#9d69ff';ctx.shadowColor='#9d69ff';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(x+10,y+10,10,0,7);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#e7dbff';ctx.beginPath();ctx.arc(x+7,y+7,3,0,7);ctx.fill()}else{ctx.fillStyle='#ff4e9b';for(let s=0;s<h.w;s+=14){ctx.beginPath();ctx.moveTo(x+s,y+22);ctx.lineTo(x+s+7,y);ctx.lineTo(x+s+14,y+22);ctx.fill()}}ctx.globalAlpha=1});ctx.fillStyle='#ffcf55';ctx.fillRect(495,18,70,7);ctx.fillStyle='#fff6b7';ctx.fillRect(505,25,50,45);ctx.fillStyle='#ffcf55';ctx.fillRect(515,35,30,35);
      powerups.forEach(u=>{ctx.save();ctx.translate(u.x,u.y+Math.sin(t*.008+u.x)*2);if(u.type==='gun'){ctx.fillStyle='#ffe65c';ctx.fillRect(-16,-7,25,10);ctx.fillRect(5,2,7,11);ctx.fillStyle='#fff7bf';ctx.fillRect(9,-4,13,4);ctx.fillStyle='#7a4b20';ctx.fillRect(-6,3,7,10)}else{ctx.fillStyle='#ff7ab7';ctx.fillRect(-12,-15,24,30);ctx.fillStyle='#fff0fa';ctx.beginPath();ctx.arc(0,-5,4,0,7);ctx.fill();ctx.fillStyle='#6b1b51';ctx.fillRect(-6,4,12,7);ctx.fillStyle='#fff0fa';ctx.fillRect(-8,15,5,3);ctx.fillRect(3,15,5,3)}ctx.restore()});projectiles.forEach(s=>{ctx.fillStyle='#fff4a6';ctx.fillRect(s.x-8,s.y-3,16,6)});
      players.forEach(p=>{if(p.respawn>0&&Math.floor(p.respawn/4)%2===0)return;ctx.save();ctx.translate(p.x+p.w/2,p.y+p.h/2);if(p.shield>0){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.stroke()}if(p.avatar==='bot'){ctx.fillStyle=p.d;ctx.fillRect(-14,-16,28,29);ctx.fillStyle=p.c;ctx.fillRect(-11,-13,22,21);ctx.fillStyle='#10132c';ctx.fillRect(-7,-7,14,6);ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(0,-23);ctx.stroke();ctx.beginPath();ctx.arc(0,-25,3,0,7);ctx.fill()}else if(p.avatar==='ghost'){ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(0,-6,14,Math.PI,0);ctx.lineTo(14,15);ctx.lineTo(5,10);ctx.lineTo(0,15);ctx.lineTo(-6,10);ctx.lineTo(-14,15);ctx.closePath();ctx.fill();ctx.fillStyle='#10132c';ctx.fillRect(p.facing>=0?3:-9,-7,5,7)}else{ctx.fillStyle=p.d;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2+3,-p.h/2+3,p.w-6,p.h-11);ctx.fillStyle='#10132c';ctx.fillRect(p.facing>=0?4:-10,-9,6,6)}if(p.power){ctx.fillStyle=p.power==='gun'?'#ffe65c':'#ff7ab7';ctx.fillRect(-10,-25,20,4)}if(p.dash>0){ctx.strokeStyle=p.c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-Math.sign(p.vx||1)*24,4);ctx.lineTo(-Math.sign(p.vx||1)*44,4);ctx.stroke()}ctx.restore()});particles.forEach(q=>{ctx.globalAlpha=q.life/36;ctx.fillStyle=q.c;ctx.fillRect(q.x,q.y,4,4)});ctx.globalAlpha=1;ctx.fillStyle='#dce0ff';ctx.font='900 23px ui-rounded, sans-serif';ctx.fillText(`${time}`,20,37);}
    showIntro(); requestAnimationFrame(tick);
  })();
